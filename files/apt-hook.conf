// Installed by debian-dark-boot install.sh. uninstall.sh removes it.
// After each dpkg run, warn when an upgrade of grub-common has replaced
// /etc/grub.d/10_linux and the boot splash edits are gone.
DPkg::Post-Invoke {
  "if [ -e /etc/default/grub.d/debian-dark.cfg ] && [ -e /etc/grub.d/10_linux ] && ! grep -q 'GRUB_CMDLINE_LINUX_SPLASH' /etc/grub.d/10_linux; then echo 'debian-dark-boot: /etc/grub.d/10_linux was replaced. Run install.sh again to get the boot splash back.' >&2; fi";
};
