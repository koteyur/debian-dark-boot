# Boot splash "debian-dark". Installed by debian-dark-boot install.sh.
# uninstall.sh removes this file. grub-mkconfig reads it after
# /etc/default/grub, so the values here win.
GRUB_THEME=/boot/grub/themes/debian-dark/theme.txt
# Set but empty. This stops /etc/grub.d/05_debian_theme from putting the
# desktop-base picture behind the GRUB terminal.
GRUB_BACKGROUND=
# The menu always shows. GRUB_TIMEOUT stays as set in /etc/default/grub.
GRUB_TIMEOUT_STYLE=menu
# "auto" keeps the mode that the firmware already uses, usually the
# native mode of the screen. Linux then keeps the same mode.
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
# Kernel options for the main Debian entry only. A changed line in
# /etc/grub.d/10_linux adds them to the "simple" entry. The entries in
# "Advanced options" keep the stock options of /etc/default/grub.
# "export" is needed, because grub-mkconfig exports only its own variables.
# loglevel=3: only critical kernel messages print on the screen. The
# journal still has all of them.
export GRUB_CMDLINE_LINUX_SPLASH="splash vt.global_cursor_default=0 loglevel=3"
